name: Build and verify UMLRT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      - name: Make, check, generate, compile and execute
        shell: pwsh
        run: .\gradlew.bat --no-daemon --console=plain --continue check verifyPapyrusPingPong
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: verification-reports
          path: |
            build/TEST-*.xml
            build/reports/
            build/tmp/*/system/log/idea.log
            build/papyrus-pingpong/Testing/Temporary/LastTest.log
          if-no-files-found: warn
